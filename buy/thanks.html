<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Your mock exam is unlocked</title>
<link rel="icon" href="../favicon.svg">
<style>
:root{--bg:#fffaf0;--ink:#222;--ink2:#1f1b17;--mute:#5f574c;--line:#e0d6c2;--accent:#e8412c;--tint:#ffe7e1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 16px 72px}
h1{font-size:clamp(30px,8.5vw,42px);line-height:1.15;margin:0 0 12px;font-weight:900;color:var(--ink2);text-wrap:balance}
h2{font-size:1.25rem;margin:32px 0 8px;font-weight:900;color:var(--ink2)}
p{margin:0 0 12px;text-wrap:pretty}
a{color:var(--accent)}
.k{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.btn{font:inherit;min-height:56px;padding:12px 20px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-weight:800;font-size:17px;text-decoration:none;display:flex;align-items:center;justify-content:center;margin:18px 0 10px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.link{background:var(--tint);border-radius:14px;padding:14px;font-size:15px;word-break:break-all;margin:8px 0}
.mute{color:var(--mute);font-size:14px}
</style></head><body><main id="m">
<p class="k">Payment received</p>
<h1>Loading your mock.</h1>
</main>
<script src="../engine/config.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search),lv=(q.get('level')||'').toLowerCase(),key=q.get('key')||'',lessons=q.get('lessons')==='1';
  var m=document.getElementById('m'),ok=key&&UNLOCK_KEYS[lv]===key;
  if(!ok){m.innerHTML='<p class="k">This link is not valid</p><h1>We could not unlock the mock from this link.</h1><p>Open the exact link from the page you landed on after paying. If it still fails, send your receipt through the contact form on the <a href="https://lessons.animesenseijp.com/">lesson site</a> and we will sort it out.</p><a class="btn ghost" href="index.html">Back to the packs</a>';return}
  var levels=lv==='both'?['n5','n4']:[lv];
  try{levels.forEach(function(l){localStorage.setItem('jlptmock:unlock:'+l,'1')})}catch(e){}
  var U=function(s){return s.toUpperCase()},here=location.href.split('#')[0];
  m.innerHTML='<p class="k">Payment received</p><h1>Your '+levels.map(U).join(' and ')+' mock is unlocked on this device.</h1>'
   +'<p>All three sections, every listening clip, and the explanation for every answer choice. Retake as often as you like until December 6.</p>'
   +levels.map(function(l){return '<a class="btn" href="../index.html#'+l+'-full">Open the '+U(l)+' mock</a>'}).join('')
   +'<h2>Studying on another phone?</h2><p>Open this same page there once. It unlocks that device too.</p><div class="link" id="u">'+here+'</div><button class="btn ghost" id="cp">Copy the link</button>'
   +(lessons?'<h2>Your two lessons</h2><p>Send your receipt number through the contact form on the <a href="https://lessons.animesenseijp.com/">lesson site</a> and say which days suit you. We book the two 60-minute lessons from there.</p>':'')
   +'<p class="mute">Refunds: 7 days, no questions, by replying to your receipt.</p>';
  document.getElementById('cp').onclick=function(){var b=this;navigator.clipboard.writeText(here).then(function(){b.textContent='Copied'},function(){b.textContent='Select the link above and copy it'})};
})();
</script></body></html>
